<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠로코의 농구 아카이브 위키</title>
    <style>
        :root {
            --primary-color: #1a73e8; /* 세이린 블루톤 */
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 사이드바 메뉴 */
        nav {
            width: 250px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        nav h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav li {
            margin-bottom: 10px;
        }
        nav a {
            text-decoration: none;
            color: #555;
            display: block;
            padding: 8px 12px;
            border-radius: 4px;
            transition: 0.2s;
        }
        nav a:hover {
            background-color: #e8f0fe;
            color: var(--primary-color);
        }
        /* 메인 콘텐츠 영역 */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: #fff;
        }
        article {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }
        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <nav>
        <h2>🏀 KNB Archive</h2>
        <ul>
            <li><a href="#home" onclick="loadPage('home')">홈 / 소개</a></li>
            <li><a href="#characters" onclick="loadPage('characters')">기적의 세대 & 팀</a></li>
            <li><a href="#fanart" onclick="loadPage('fanart')">창작물 및 연성</a></li>
            <li><a href="#goods" onclick="loadPage('goods')">굿즈 컬렉션</a></li>
        </ul>
    </nav>

    <main>
        <article id="content">
            <!-- 기본 홈 화면 내용 -->
            <h1>쿠로코의 농구 아카이브에 오신 것을 환영합니다!</h1>
            <p>나만의 취향과 제작물들을 차곡차곡 모아두는 개인 위키 공간입니다.</p>
            <div class="card-grid">
                <div class="card">
                    <h3>💡 Tip</h3>
                    <p>좌측 메뉴를 눌러 카테고리별로 기록을 정리해 보세요.</p>
                </div>
            </div>
        </article>
    </main>

    <script>
        // 간단한 페이지 전환 스크립트 예시
        function loadPage(page) {
            const content = document.getElementById('content');
            if (page === 'home') {
                content.innerHTML = `
                    <h1>쿠로코의 농구 아카이브</h1>
                    <p>나만의 취향과 제작물들을 차곡차곡 모아두는 개인 위키 공간입니다.</p>
                `;
            } else if (page === 'characters') {
                content.innerHTML = `
                    <h1>기적의 세대 & 주요 캐릭터</h1>
                    <p>세이린 고교, 카이조, 슈토쿠, 토오 학원, 요센, 라락산 등 캐릭터별 데이터베이스.</p>
                `;
            } else if (page === 'fanart') {
                content.innerHTML = `
                    <h1>창작물 및 연성 목록</h1>
                    <p>직접 그린 팬아트, 쓴 글, 혹은 소장 중인 연성들을 모아두는 공간입니다.</p>
                `;
            } else if (page === 'goods') {
                content.innerHTML = `
                    <h1>굿즈 컬렉션</h1>
                    <p>넨도로이드, 아크릴 스탠드, 단행본 등 수집한 굿즈 리스트.</p>
                `;
            }
        }
    </script>
</body>
</html>
